name: Bug report
description: Report a reproducible problem in the Bondie-Docferry plugin.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Bondie-Docferry. Do not include private links, note content, Vault paths, account details, or session values.
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: 0.1.1
    validations:
      required: true
  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian version
      placeholder: 1.12.7
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use non-sensitive example data and include the smallest reliable sequence.
      placeholder: |
        1. Open Bondie-Docferry
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add a redacted screenshot if it helps. Never attach account data, private URLs, note content, or tokens.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private links, note content, Vault paths, account details, and session values.
          required: true
